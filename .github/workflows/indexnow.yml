name: IndexNow daily
on:
  schedule: [{cron: "17 11 * * *"}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs
        run: |
          URLS=$(curl -s https://nickcastrobuilds.com/sitemap.xml | grep -oE '<loc>[^<]+' | sed 's/<loc>//' | jq -R . | jq -sc .)
          BODY=$(jq -nc --argjson u "$URLS" '{host:"nickcastrobuilds.com",key:"0482035c521f1b7f0a71c1544dd14b2f",keyLocation:"https://nickcastrobuilds.com/0482035c521f1b7f0a71c1544dd14b2f.txt",urlList:$u}')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "IndexNow HTTP $CODE"
          [ "$CODE" = 200 ] || [ "$CODE" = 202 ]
